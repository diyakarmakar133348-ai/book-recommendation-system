{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-lg border-0 rounded-4 p-4" style="background: #1e1e2f; color: white;">
            <div class="card-body text-center">
                <h2><i class="bi bi-emoji-smile text-warning"></i> Welcome, New Reader!</h2>
                <p>Tell us what you love, and we'll find the best books for you.</p>
                <form action="/cold_start_recommend" method="POST">
                    <div class="row g-3 mt-3">
                        {% for genre in ['Fiction', 'Fantasy', 'Romance', 'Thriller', 'Sci-Fi', 'Non-Fiction', 'Mystery', 'Horror', 'Historical', 'Comedy'] %}
                        <div class="col-md-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="genres" value="{{ genre }}" id="genre_{{ loop.index }}">
                                <label class="form-check-label" for="genre_{{ loop.index }}">
                                    {{ genre }}
                                </label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg mt-4 px-5 fw-bold">Get Recommendations <i class="bi bi-heart"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
